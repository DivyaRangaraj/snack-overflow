services:
  # 1. Backend API Service
  - type: web
    name: snack-overflow-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run db:seed && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: snack-overflow-db
          property: connectionString

  # 2. Frontend React Client
  - type: web
    name: snack-overflow-app
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: snack-overflow-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # 3. Cloud PostgreSQL Database
  - name: snack-overflow-db
    plan: free
    databaseName: snack_overflow
    user: snack_admin
