<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="studio-bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </radialGradient>
  </defs>
  
  <!-- Studio White/Grey Neutral Backing -->
  <rect width="400" height="300" fill="url(#studio-bg)" />
  
  <!-- Subtle category accent light in background -->
  <circle cx="200" cy="140" r="110" fill="#451a03" opacity="0.08" filter="blur(30px)" />
  
  
      <!-- Shadow -->
      <ellipse cx="200" cy="265" rx="55" ry="10" fill="#000000" opacity="0.18" filter="blur(6px)" />
      
      <!-- Can -->
      <g transform="translate(135, 35)">
        <!-- Top Rim -->
        <ellipse cx="65" cy="16" rx="55" ry="14" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2" />
        <ellipse cx="65" cy="15" rx="45" ry="10" fill="#64748b" />
        <circle cx="65" cy="14" r="6" fill="#94a3b8" />
        
        <!-- Can Body -->
        <rect x="10" y="18" width="110" height="200" rx="10" fill="#451a03" filter="drop-shadow(0 10px 16px rgba(0,0,0,0.25))" />
        
        <!-- Metallic reflection -->
        <rect x="22" y="18" width="16" height="200" fill="#ffffff" opacity="0.28" />
        <rect x="95" y="18" width="8" height="200" fill="#000000" opacity="0.18" />
        
        <!-- Brand logo rotated / prominent -->
        <g transform="translate(65, 115)">
          <rect x="-50" y="-35" width="100" height="70" rx="8" fill="#ffffff" opacity="0.15" />
          <text x="0" y="-5" font-family="'Inter',sans-serif" font-size="20" font-weight="900" fill="#fbbf24" text-anchor="middle" letter-spacing="1">
            NESCAFE
          </text>
          <text x="0" y="15" font-family="'Inter',sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">
            Chilled Latte
          </text>
          <text x="0" y="48" font-size="28" text-anchor="middle">☕</text>
        </g>
        
        <!-- Bottom Rim -->
        <ellipse cx="65" cy="216" rx="55" ry="12" fill="#451a03" filter="brightness(0.9)" />
        <ellipse cx="65" cy="222" rx="46" ry="7" fill="#94a3b8" />
        
        <text x="65" y="196" font-family="'Inter',sans-serif" font-size="8.5" font-weight="700" fill="#ffffff" opacity="0.9" text-anchor="middle">
          CHILLED · 330ml
        </text>
      </g>
    
</svg>