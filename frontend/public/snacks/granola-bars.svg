<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="studio-bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </radialGradient>
  </defs>
  
  <!-- Studio White/Grey Neutral Backing -->
  <rect width="400" height="300" fill="url(#studio-bg)" />
  
  <!-- Subtle category accent light in background -->
  <circle cx="200" cy="140" r="110" fill="#15803d" opacity="0.08" filter="blur(30px)" />
  
  
      <!-- Shadow -->
      <ellipse cx="200" cy="225" rx="140" ry="14" fill="#000000" opacity="0.12" filter="blur(6px)" />
      
      <!-- Main Wrapper -->
      <g transform="translate(45, 80)">
        <rect x="0" y="0" width="310" height="120" rx="14" fill="#15803d" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.2))" />
        
        <!-- Left crimp -->
        <path d="M0 0 L15 15 L0 30 L15 45 L0 60 L15 75 L0 90 L15 105 L0 120" fill="none" stroke="#15803d" stroke-width="6" opacity="0.8" />
        <line x1="0" y1="0" x2="0" y2="120" stroke="#000000" stroke-width="2" opacity="0.3" />
        
        <!-- Right crimp -->
        <path d="M310 0 L295 15 L310 30 L295 45 L310 60 L295 75 L310 90 L295 105 L310 120" fill="none" stroke="#15803d" stroke-width="6" opacity="0.8" />
        
        <!-- Wrapper shine highlight -->
        <path d="M20 10 Q155 -5 290 10" stroke="#ffffff" stroke-width="3" fill="none" opacity="0.35" />
        <rect x="25" y="8" width="260" height="14" fill="#ffffff" opacity="0.12" rx="7" />
        
        <!-- Center Banner -->
        <circle cx="155" cy="60" r="46" fill="#ffffff" opacity="0.15" />
        <text x="155" y="55" font-family="'Inter',-apple-system,sans-serif" font-size="28" font-weight="900" fill="#fde047" text-anchor="middle" letter-spacing="1">
          Nature Valley
        </text>
        <text x="155" y="75" font-family="'Inter',-apple-system,sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.5" opacity="0.95">
          Oats &amp; Dark Chocolate Bar
        </text>
        
        <!-- Food Emoji Badge -->
        <circle cx="48" cy="60" r="24" fill="#ffffff" opacity="0.9" />
        <text x="48" y="68" font-size="24" text-anchor="middle">🌾</text>
        
        <!-- Right Badge -->
        <rect x="235" y="46" width="55" height="28" rx="8" fill="#ffffff" opacity="0.95" />
        <text x="262" y="64" font-family="'Inter',sans-serif" font-size="10" font-weight="800" fill="#14532d" text-anchor="middle">
          NET 100g
        </text>
        
        <!-- Bottom detail ribbon -->
        <rect x="25" y="96" width="260" height="16" rx="4" fill="#000000" opacity="0.25" />
        <text x="155" y="108" font-family="'Inter',sans-serif" font-size="9" font-weight="600" fill="#ffffff" text-anchor="middle">
          100% Whole Grain Oats
        </text>
      </g>
    
</svg>