<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="studio-bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </radialGradient>
    <linearGradient id="can-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="25%" stop-color="#dc2626" />
      <stop offset="60%" stop-color="#ef4444" />
      <stop offset="85%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
    <linearGradient id="lid-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="chip-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
  </defs>

  <!-- Studio Neutral Backing -->
  <rect width="400" height="300" fill="url(#studio-bg)" />

  <!-- Category Accent Glow in Background -->
  <circle cx="200" cy="140" r="115" fill="#dc2626" opacity="0.08" filter="blur(30px)" />

  <!-- Realistic Soft Shadow -->
  <ellipse cx="200" cy="272" rx="60" ry="12" fill="#000000" opacity="0.18" filter="blur(6px)" />

  <!-- Pringles Canister Group -->
  <g transform="translate(145, 20)">
    <!-- Can Body -->
    <rect x="5" y="24" width="100" height="225" rx="6" fill="url(#can-gradient)" filter="drop-shadow(0 12px 18px rgba(0,0,0,0.22))" />

    <!-- Vertical Gloss Streak -->
    <rect x="22" y="24" width="14" height="225" fill="#ffffff" opacity="0.25" />
    <rect x="88" y="24" width="6" height="225" fill="#000000" opacity="0.15" />

    <!-- Top Rim & Snap Lid -->
    <ellipse cx="55" cy="24" rx="52" ry="14" fill="url(#lid-gradient)" stroke="#94a3b8" stroke-width="1.5" />
    <ellipse cx="55" cy="22" rx="46" ry="10" fill="#ffffff" opacity="0.8" />
    <ellipse cx="55" cy="21" rx="42" ry="8" fill="#f8fafc" />

    <!-- Mr. P Mascot Face -->
    <g transform="translate(55, 68)">
      <!-- Oval Head -->
      <ellipse cx="0" cy="0" rx="20" ry="19" fill="#fed7aa" stroke="#ea580c" stroke-width="0.8" />
      <!-- Eyes -->
      <ellipse cx="-7" cy="-5" rx="2.5" ry="3.5" fill="#18181b" />
      <ellipse cx="7" cy="-5" rx="2.5" ry="3.5" fill="#18181b" />
      <circle cx="-6" cy="-6" r="0.8" fill="#ffffff" />
      <circle cx="8" cy="-6" r="0.8" fill="#ffffff" />
      <!-- Iconic Big Bushy Moustache -->
      <path d="M-19 3 C-14 -4 -3 1 0 7 C3 1 14 -4 19 3 C22 8 16 14 9 10 C3 7 -3 7 -9 10 C-16 14 -22 8 -19 3 Z" fill="#271c19" />
      <!-- Red Bowtie -->
      <path d="M-9 16 L0 14 L9 16 L6 20 L0 18 L-6 20 Z" fill="#dc2626" />
      <circle cx="0" cy="16" r="2.5" fill="#b91c1c" />
    </g>

    <!-- Bold Pringles Brand Wordmark -->
    <g transform="translate(55, 115)">
      <rect x="-46" y="-12" width="92" height="24" rx="6" fill="#18181b" opacity="0.85" />
      <text x="0" y="5" font-family="'Inter',-apple-system,sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">
        PRINGLES
      </text>
    </g>

    <!-- Subtitle Banner -->
    <text x="55" y="138" font-family="'Inter',sans-serif" font-size="9" font-weight="800" fill="#fef08a" text-anchor="middle" letter-spacing="0.5">
      ORIGINAL
    </text>
    <text x="55" y="149" font-family="'Inter',sans-serif" font-size="7.5" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="0.95">
      Potato Crisps
    </text>

    <!-- Stack of Curved Saddle Chips Illustration -->
    <g transform="translate(55, 182)">
      <!-- Base chip -->
      <path d="M-28 6 Q0 -10 28 6 Q16 18 -20 16 Z" fill="#b45309" opacity="0.4" />
      <!-- Stacked Chip 1 -->
      <path d="M-25 0 Q0 -14 25 0 Q14 12 -18 10 Z" fill="url(#chip-gradient)" stroke="#ca8a04" stroke-width="1" filter="drop-shadow(0 2px 3px rgba(0,0,0,0.2))" />
      <!-- Stacked Chip 2 -->
      <path d="M-24 -8 Q0 -22 24 -8 Q14 4 -18 2 Z" fill="url(#chip-gradient)" stroke="#ca8a04" stroke-width="1" filter="drop-shadow(0 3px 4px rgba(0,0,0,0.25))" />
    </g>

    <!-- Net Weight Ribbon -->
    <g transform="translate(55, 222)">
      <rect x="-35" y="-9" width="70" height="18" rx="6" fill="#ffffff" opacity="0.95" />
      <text x="0" y="3" font-family="'Inter',sans-serif" font-size="8.5" font-weight="800" fill="#991b1b" text-anchor="middle">
        NET WT 107g
      </text>
    </g>

    <!-- Bottom Metal Rim -->
    <ellipse cx="55" cy="248" rx="50" ry="11" fill="#94a3b8" stroke="#64748b" stroke-width="1" />
    <ellipse cx="55" cy="246" rx="46" ry="8" fill="#cbd5e1" />
  </g>
</svg>
